name: Tifusi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: true
  CCACHE_MAXSIZE: 400M
  CC: gcc
  OS_NAME: linux

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TEST: android
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        id: ndk-install
        run: |
          NDK_VERSION=$(grep "ndkVersion" src/frontends/android/app/build.gradle | sed -e 's/.*"\(.*\)"/\1/')
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: |
            ccache-android-
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'
      - run: |
          sudo apt-get install -qq ccache
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.TIFUSI_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/tifusi.jks
          echo "TIFUSI_KEYSTORE=$RUNNER_TEMP/tifusi.jks" >> $GITHUB_ENV
      - uses: ./.github/actions/default
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk-install.outputs.ANDROID_NDK_ROOT }}
          TIFUSI_KEYSTORE_PASSWORD: ${{ secrets.TIFUSI_KEYSTORE_PASSWORD }}
      - run: |
          V=$(grep versionName src/frontends/android/app/build.gradle | sed -e 's/.*"\(.*\)"/\1/')
          cp src/frontends/android/app/build/outputs/apk/release/app-release.apk tifusi-$V.apk
          rm -f $RUNNER_TEMP/tifusi.jks
      - uses: actions/upload-artifact@v4
        with:
          name: tifusi-apk
          path: tifusi-*.apk
